<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="حساب فري فاير نادر!">
    <meta property="og:description" content="اضغط لمشاهدة تفاصيل الحساب">
    <meta property="og:image" content="https://i.ibb.co/TqbRD8DB/1786299456735.png">
    <meta property="og:type" content="website">
    <title>تحميل...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }

        /* حاوية تجمع الصورة والنص في البداية */
        #prank-box {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: black;
            z-index: 999;
        }

        /* تنسيق النص التحذيري */
        #prank-text {
            font-family: 'Cairo', sans-serif;
            font-size: 2.5em;
            color: #00ff55;
            background-color: rgba(0, 0, 0, 0.85);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid #00ff55;
            box-shadow: 0 0 15px rgba(0, 255, 85, 0.5);
            z-index: 1000;
        }

        /* تنسيق صورتك الشخصية */
        #prank-image {
            width: 70vw;
            max-width: 400px;
            height: auto;
            border-radius: 10px;
            border: 3px solid white;
            object-fit: cover;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="prank-box">
        <div id="prank-text">أنت غبي يا صديقي<br>هاتفك احمق</div>
        <img id="prank-image" src="https://i.ibb.co/TqbRD8DB/1786299456735.png" alt="Ayoub Anarchy">
    </div>

    <script>
        window.onload = function() {
            var box = document.getElementById('prank-box');
            var txt = document.getElementById('prank-text');
            var img = document.getElementById('prank-image');

            // المرحلة الأولى: يظهر الكلام والصورة معاً لمدة ثانيتين (2000 ملي ثانية)
            setTimeout(function() {
                // إخفاء النص
                txt.style.display = 'none';

                // تحويل الحاوية إلى شكل صغير لتحريكه
                box.style.width = '120px';
                box.style.height = '120px';
                box.style.justifyContent = 'flex-start';
                box.style.alignItems = 'flex-start';
                box.style.background = 'transparent';

                // تصغير الصورة لتناسب الحجم المتحرك
                img.style.width = '120px';
                img.style.height = '120px';
                img.style.borderRadius = '50%'; // جعلها دائرية أثناء الحركة أو اذفها إذا أردتها مربعة
                img.style.border = '3px solid #00ff55';

                // إحداثيات وسرعة الحركة في الاتجاهات الأربعة
                var posX = window.innerWidth / 2 - 60;
                var posY = window.innerHeight / 2 - 60;
                var speedX = 8;
                var speedY = 8;

                box.style.left = posX + 'px';
                box.style.top = posY + 'px';

                // حلقة تحريك الصورة في الشاشة لمدة 4 ثوانٍ
                var moveInterval = setInterval(function() {
                    posX += speedX;
                    posY += speedY;

                    // الارتطام باليمين أو اليسار
                    if (posX + 120 >= window.innerWidth || posX <= 0) {
                        speedX = -speedX;
                    }
                    // الارتطام بالأعلى أو الأسفل
                    if (posY + 120 >= window.innerHeight || posY <= 0) {
                        speedY = -speedY;
                    }

                    box.style.left = posX + 'px';
                    box.style.top = posY + 'px';
                }, 25);

                // المرحلة الثالثة: إيقاف الحركة وإخفاء كل شيء بعد 4 ثوانٍ من بدء الحركة
                setTimeout(function() {
                    clearInterval(moveInterval);
                    box.style.display = 'none';
                }, 4000);

            }, 2000); // 2000 تعني ثانيتين العرض الثابت الأول
        };
    </script>
</body>
</html>
