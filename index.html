<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="حساب فري فاير نادر!">
    <meta property="og:description" content="اضغط لمشاهدة تفاصيل الحساب">
    <meta property="og:image" content="https://i.ibb.co/TqbRD8DB/1786299456735.png">
    <meta property="og:type" content="website">
    <title>تحميل...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* حاوية عامة للشاشة */
        #prank-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: black;
            z-index: 999;
        }

        /* تنسيق النص التحذيري */
        #prank-text {
            font-family: 'Cairo', sans-serif;
            font-size: 2.5em;
            color: #00ff55;
            background-color: rgba(0, 0, 0, 0.85);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid #00ff55;
            box-shadow: 0 0 15px rgba(0, 255, 85, 0.5);
            z-index: 1000;
        }

        /* تنسيق صورتك الشخصية */
        #prank-image {
            width: 70vw;
            max-width: 350px;
            height: auto;
            border-radius: 0; /* شكل مربع تماماً */
            border: 3px solid white;
            object-fit: cover;
            transition: all 0.5s ease;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="prank-container">
        <div id="prank-text">أنت غبي يا صديقي<br>هاتفك احمق</div>
        <img id="prank-image" src="https://i.ibb.co/TqbRD8DB/1786299456735.png" alt="Ayoub Anarchy">
    </div>

    <script>
        window.onload = function() {
            var container = document.getElementById('prank-container');
            var txt = document.getElementById('prank-text');
            var img = document.getElementById('prank-image');

            // المرحلة الأولى: يظهر الكلام والصورة لمدة ثانيتين (2000 ملي ثانية)
            setTimeout(function() {
                // إخفاء النص
                txt.style.display = 'none';

                // تصغير الصورة لتصبح مربعة في المنتصف تماماً
                img.style.width = '120px';
                img.style.height = '120px';
                img.style.position = 'absolute';
                
                // جعل الصورة تتمدد ببطء وسلاسة لتملأ الشاشة بالكامل خلال 10 ثوانٍ
                img.style.transition = 'width 10s ease, height 10s ease';
                
                // أمر بدء التمدد ليصبح حجمها يملأ الشاشة
                setTimeout(function() {
                    img.style.width = '100vw';
                    img.style.height = '100vh';
                    img.style.maxWidth = 'none';
                    img.style.borderRadius = '0';
                    img.style.border = 'none';
                }, 50);

                // إخفاء كل شيء بعد انتهاء مدة التمدد (10 ثوانٍ)
                setTimeout(function() {
                    container.style.display = 'none';
                }, 10000);

            }, 2000); // 2000 ملي ثانية (ثانيتان للعرض الثابت الأول)
        };
    </script>
</body>
</html>
