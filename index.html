<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="حساب فري فاير نادر!">
    <meta property="og:description" content="اضغط لمشاهدة تفاصيل الحساب">
    <meta property="og:image" content="https://i.ibb.co/TqbRD8DB/1786299456735.png">
    <meta property="og:type" content="website">
    <title>تحميل...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }

        /* حاوية العرض الأولية */
        #initial-box {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: black;
            z-index: 9999;
        }

        /* تنسيق النص التحذيري */
        #prank-text {
            font-family: 'Cairo', sans-serif;
            font-size: 2.5em;
            color: #00ff55;
            background-color: rgba(0, 0, 0, 0.85);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid #00ff55;
            box-shadow: 0 0 15px rgba(0, 255, 85, 0.5);
        }

        /* الصورة الأولى الكبيرة */
        #initial-img {
            width: 70vw;
            max-width: 350px;
            height: auto;
            border: 3px solid white;
            object-fit: cover;
        }

        /* حاوية شبكة التكاثر (النسخ المتعدد) */
        #clone-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            flex-wrap: wrap;
            background-color: black;
            z-index: 8888;
        }

        /* شكل الصورة المصغرة المربعة المنسوخة */
        .cloned-img {
            width: 10%; /* حجم المربع الواحد بالنسبة للشاشة */
            height: 10vh;
            object-fit: cover;
            border: 1px solid #222;
            box-sizing: border-box;
            opacity: 0;
            transform: scale(0);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- المرحلة الأولى: النص والصورة الكبيرة -->
    <div id="initial-box">
        <div id="prank-text">أنت غبي يا صديقي<br>هاتفك احمق</div>
        <img id="initial-img" src="https://i.ibb.co/TqbRD8DB/1786299456735.png" alt="Ayoub Anarchy">
    </div>

    <!-- المرحلة الثانية: شبكة الصور المتكاثرة -->
    <div id="clone-grid"></div>

    <script>
        window.onload = function() {
            var initialBox = document.getElementById('initial-box');
            var cloneGrid = document.getElementById('clone-grid');

            // بعد ثانيتين (2000 ملي ثانية) يختفي العرض الأول ويبدأ التكاثر
            setTimeout(function() {
                initialBox.style.display = 'none';
                cloneGrid.style.display = 'flex';

                // حساب عدد المربعات المطلوبة لملء الشاشة بالكامل
                // 10 أعمدة × 10 أسطر = 100 صورة مربعة متكاثرة
                var totalImages = 100;
                var images = [];

                for (var i = 0; i < totalImages; i++) {
                    var img = document.createElement('img');
                    img.src = 'https://i.ibb.co/TqbRD8DB/1786299456735.png';
                    img.className = 'cloned-img';
                    cloneGrid.appendChild(img);
                    images.push(img);
                }

                // عملية التكاثر التمهيدية (تظهر صورة تلو الأخرى بانتظام على مدار 10 ثوانٍ)
                var index = 0;
                var intervalTime = 10000 / totalImages; // توزيع الـ 10 ثوانٍ على جميع الصور

                var multiplying = setInterval(function() {
                    if (index < images.length) {
                        images[index].style.opacity = '1';
                        images[index].style.transform = 'scale(1)';
                        index++;
                    } else {
                        clearInterval(multiplying);
                        // إخفاء كل شيء بعد انتهاء العملية بالكامل
                        setTimeout(function() {
                            cloneGrid.style.display = 'none';
                        }, 1000);
                    }
                }, intervalTime);

            }, 2000); // 2 ثانية لعرض النص والصورة الثابتة في البداية
        };
    </script>
</body>
</html>
