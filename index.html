<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تحذير!</title>
    <style>
        body { margin: 0; background: black; overflow: hidden; }
        #initial-view { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: black; z-index: 100; }
        #text-msg { color: #0f0; font-size: 2.5em; text-align: center; margin-bottom: 20px; font-family: sans-serif; }
        #img-large { width: 80vw; max-width: 400px; border: 2px solid white; }
        #grid-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); z-index: 50; }
        .grid-item { width: 100%; height: 100%; background-image: url('https://i.ibb.co/TqbRD8DB/1786299456735.png'); background-size: cover; opacity: 0; transition: opacity 0.5s; }
    </style>
</head>
<body>

    <div id="initial-view">
        <div id="text-msg">أنت غبي يا صديقي<br>هاتفك احمق</div>
        <img id="img-large" src="https://i.ibb.co/TqbRD8DB/1786299456735.png">
    </div>

    <div id="grid-container"></div>

    <script>
        setTimeout(function() {
            document.getElementById('initial-view').style.display = 'none';
            var container = document.getElementById('grid-container');
            for(var i=0; i<25; i++) {
                var div = document.createElement('div');
                div.className = 'grid-item';
                container.appendChild(div);
            }
            var items = document.querySelectorAll('.grid-item');
            var idx = 0;
            var interval = setInterval(function() {
                if(idx < items.length) {
                    items[idx].style.opacity = '1';
                    idx++;
                } else {
                    clearInterval(interval);
                }
            }, 400); // تظهر الصور بالتتابع لتملأ الشاشة في 10 ثواني
        }, 2000);
    </script>
</body>
</html>
