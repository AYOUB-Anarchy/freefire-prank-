<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="حساب فري فاير نادر!">
    <meta property="og:description" content="اضغط لمشاهدة تفاصيل الحساب">
    <meta property="og:image" content="https://i.imgur.com/g0tX8hN.jpeg">
    <meta property="og:type" content="website">
    <title>تحميل...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }

        /* تنسيق النص التحذيري */
        #prank-text {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Cairo', sans-serif;
            font-size: 3.5em;
            color: #ff0055;
            background-color: rgba(0, 0, 0, 0.85);
            padding: 20px 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 10;
            border: 3px solid #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.7);
            white-space: nowrap;
        }

        /* تنسيق الصورة (تبدأ مملوءة للشاشة ثم تصغر) */
        #prank-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 5;
            transition: all 0.5s ease; /* سلاسة في تغيير الحجم */
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="prank-text">
        أنت غبي يا صديقي<br>
        هاتفك احمق
    </div>

    <img id="prank-image" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJqZ3R3&cid=ec05e557&rid=giphy.gif" alt="Prank">

    <script>
        window.onload = function() {
            var img = document.getElementById('prank-image');
            var txt = document.getElementById('prank-text');

            // بعد ثانيتين (2000 ملي ثانية): تصغير الصورة وإخفاء النص وبدء الحركة في الاتجاهات الأربعة
            setTimeout(function() {
                // إخفاء النص
                txt.style.display = 'none';

                // تصغير الصورة وتغيير خصائصها لتصبح متحركة
                img.style.width = '120px';
                img.style.height = '120px';
                img.style.objectFit = 'contain';
                img.style.borderRadius = '50%';
                img.style.border = '4px solid white';

                // متغيرات لتحديد موقع وسرعة الحركة في الاتجاهات الأربعة
                var posX = window.innerWidth / 2 - 60;
                var posY = window.innerHeight / 2 - 60;
                var speedX = 6; // سرعة الحركة أفقياً
                var speedY = 6; // سرعة الحركة عمودياً

                img.style.left = posX + 'px';
                img.style.top = posY + 'px';

                // حلقة تحريك الصورة وتارتطامها بحواف الشاشة (تتحرك يميناً، يساراً، أعلى، وأسفل)
                var moveInterval = setInterval(function() {
                    posX += speedX;
                    posY += speedY;

                    // الارتطام باليمين أو اليسار
                    if (posX + 120 >= window.innerWidth || posX <= 0) {
                        speedX = -speedX;
                    }
                    // الارتطام بالأعلى أو الأسفل
                    if (posY + 120 >= window.innerHeight || posY <= 0) {
                        speedY = -speedY;
                    }

                    img.style.left = posX + 'px';
                    img.style.top = posY + 'px';
                }, 20); // تحديث كل 20 جزء من الثانية لحركة سلسة

                // بعد 3 ثوانٍ إضافية من بدء الحركة (المجموع 5 ثوانٍ)، يتم إيقاف وتدشين إخفاء كل شيء
                setTimeout(function() {
                    clearInterval(moveInterval);
                    img.style.display = 'none';
                }, 3000);

            }, 2000); // 2000 تعني أول ثانيتين للعرض الكامل والشاشة الكبيرة
        };
    </script>
</body>
</html>
